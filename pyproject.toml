[project]
name = "socialmgr"
version = "0.1.0"
description = "Local analytics and experimentation workbench for one X account"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.36",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
socialmgr = "socialmgr.cli:app"

[project.optional-dependencies]
api = [
    "anthropic>=2.14.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "scipy-stubs>=1.18.1.1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["socialmgr"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×"]  # effect ratios read "1.38×" on the screens, as on the canvas

[tool.ruff.lint.per-file-ignores]
"socialmgr/db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["socialmgr"]

[[tool.mypy.overrides]]
module = ["alembic.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: replicated simulations with >= 1,000 replicates (minutes); run by scripts/check.sh in full mode or `pytest -m slow`",
]
